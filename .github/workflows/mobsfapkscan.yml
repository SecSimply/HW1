name: MobSF APK Scan

on:
  workflow_dispatch:

jobs:
  mobsf-apk-scan:
    runs-on: ubuntu-latest
    services:
      mobsf:
        image: opensecurity/mobile-security-framework-mobsf:latest
        ports:
          - 8000:8000
        env:
          MOBSF_API_KEY: ${{ secrets.MOBSF_API_KEY }}
        options: >-
          --health-cmd "curl -f http://localhost:8000/ || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 90s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Debug APK path
        run: find . -name "*.apk" -type f

      - name: Upload and scan APK
        env:
          MOBSF_API_KEY: ${{ secrets.MOBSF_API_KEY }}
          APK: app/build/outputs/apk/release/app-release-unsigned.apk
        run: |
          HASH=$(curl -s \
            -F "file=@${APK}" \
            -H "X-Mobsf-Api-Key: ${MOBSF_API_KEY}" \
            http://localhost:8000/api/v1/upload | jq -r '.hash')

          curl -s -X POST \
            -H "X-Mobsf-Api-Key: ${MOBSF_API_KEY}" \
            -d "hash=${HASH}" \
            http://localhost:8000/api/v1/scan > /dev/null

          curl -s -X POST \
            -H "X-Mobsf-Api-Key: ${MOBSF_API_KEY}" \
            -d "hash=${HASH}" \
            http://localhost:8000/api/v1/report_json \
            -o mobsf-apk-report.json

          curl -s -X POST \
            -H "X-Mobsf-Api-Key: ${MOBSF_API_KEY}" \
            -d "hash=${HASH}" \
            http://localhost:8000/api/v1/download_pdf \
            -o mobsf-apk-report.pdf

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobsf-apk-reports
          path: |
            mobsf-apk-report.json
            mobsf-apk-report.pdf